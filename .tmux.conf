### Options and bindings

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g history-limit 100000

# Allows for faster key repetition
set -s escape-time 0

# Rather than constraining window size to the maximum size of any client 
# connected to the *session*, constrain window size to the maximum size of any 
# client connected to *that window*. Much more reasonable.
set -g aggressive-resize on

# Activity monitoring
set -g monitor-activity on
set -g visual-activity on

# auto window rename
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# auto window renumbering after close
set -g renumber-windows on

# neovim and other plugins
set -g focus-events on

# allow mouse clicks to interact with tmux
set -g mouse on

# C-d is the new C-b
set -g prefix C-d
# recursive bind
bind-key d send-prefix

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Vi copypaste mode
set -g mode-keys vi
bind-key -Tcopy-mode-vi v send -X begin-selection
# X11 (requires xsel)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
# Wayland (requires wl-clipboard)
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy && wl-paste -n | wl-copy -p"

# rebind some commands, unbind old ones for muscle memory
unbind c
unbind '"'
unbind %
unbind Left
unbind Down
unbind Up
unbind Right
unbind C-Left
unbind C-Down
unbind C-Up
unbind C-Right
bind c new-window -c "#{pane_current_path}"
bind = split-window -v -c "#{pane_current_path}"
bind - split-window -h -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R


### Theming

%hidden color_red="#ff5c57"
%hidden color_green="#5af78e"
%hidden color_yellow="#f3f99d"
%hidden color_blue="#57c7ff"
%hidden color_magenta="#ff6ac1"
%hidden color_cyan="#9aedfe"

%hidden color_ui_00="#eff0eb" # white / foreground
%hidden color_ui_01="#a8b4ea"
%hidden color_ui_02="#949ecc"
%hidden color_ui_03="#858db5"
%hidden color_ui_04="#626784"
%hidden color_ui_05="#44485b"
%hidden color_ui_06="#3a3d4d"
%hidden color_ui_07="#282a36" # black / background
%hidden color_ui_08="#252630" # black / background / dimmed

set -g status-style fg="${color_ui_00}",bg="${color_ui_07}"

set -g window-status-style fg="${color_ui_00}",bg="${color_ui_07}",dim
set -g window-status-current-style fg="${color_ui_06}",bg="${color_ui_01}",bold
set -g window-status-activity-style fg="${color_ui_00}",bg="${color_ui_05}",dim

set -g pane-border-style fg="${color_ui_00}"
set -g pane-active-border-style fg="${color_ui_01}"
set -g pane-border-lines single
set -g pane-border-status off

set -g message-style fg="${color_ui_01}",bg="${color_ui_07}",bright

set -g mode-style fg="${color_ui_06}",bg="${color_ui_01}",bold

set -g display-panes-colour "${color_ui_01}"
set -g display-panes-active-colour "${color_ui_03}"

set -g clock-mode-colour "${color_ui_01}"

set -g status on
set -g status-interval 60
set -g status-justify left
set -g status-left-length 10
set -g status-right-length 140
set -g status-left ''
set -g status-right '#[fg=#{color_ui_01}]#{user}@#[fg=#{color_green}]#{host_short}'

set -g window-status-format " #{window_index} #{window_name} "
set -g window-status-current-format " #{window_index}#{window_flags}#{window_name} "
